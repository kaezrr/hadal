[package]
name = "hadal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = { version = "0.34.3", features = ["bytemuck"] }
gltf = "1.4.1"
log = "0.4.34"
pollster = "1.0.1"
thiserror = "2.0.21"
wgpu = "30.0.1"
winit = "0.30.13"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "warn"

cast_possible_truncation = "allow"
